# Veröffentlicht das Spiel (Ordner public/) automatisch auf GitHub Pages
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r public/* _site/
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="de"><head><meta charset="UTF-8">
          <meta http-equiv="refresh" content="0; url=duelist/">
          <title>DUELIST</title></head>
          <body><a href="duelist/">DUELIST spielen</a></body></html>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
